<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <h1 class="app-title">My Todo List</h1>
        <div class="profile">
            <span class="profile-name">Josephus Bawah</span>
            <div class="profile-icon" aria-hidden="true">JB</div>
        </div>
    </header>

    <main class="todo-panel">
        <ul id="todo-list" class="todo-list">
            <!-- Todos are added here by script.js -->
        </ul>

        <form id="new-todo-form" class="new-todo">
            <div class="new-todo-fields">
                <input id="todo-title" type="text" placeholder="New task" required>
                <input id="todo-description" type="text" placeholder="This should be for a new task" required>
            </div>
            <button type="submit" class="add-button" aria-label="Add todo">+</button>
        </form>

        <p id="message" class="message" hidden></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
